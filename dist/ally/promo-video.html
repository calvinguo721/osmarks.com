<script src="../assets/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const cv=document.createElement('canvas');cv.width=720;cv.height=1280;
const ctx=cv.getContext('2d');
const fmt=webm=>webm&&MediaRecorder.isTypeSupported(webm)?webm:(MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':'video/webm');
function qrCanvas(text,size){
  try{const q=qrcode(0,'M');q.addData(text);q.make();
    const n=q.getModuleCount(),c=document.createElement('canvas'),x=c.getContext('2d');
    const quiet=4,cell=Math.ceil(size/(n+quiet*2));
    c.width=c.height=(n+quiet*2)*cell;x.fillStyle='#040b18';x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#eaf4ff';
    for(let r=0;r<n;r++)for(let col=0;col<n;col++)if(q.isDark(r,col))x.fillRect((col+quiet)*cell,(r+quiet)*cell,cell,cell);
    return c;
  }catch(e){return null}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function pop(t){return t>=1?1:1-Math.pow(1-t,3)}
function aurora(t){
  ctx.fillStyle='#040b18';ctx.fillRect(0,0,720,1280);
  const drift=Math.sin(t*.6)*40;
  const blob=(cx,cy,r,c)=>{const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(4,11,24,0)');ctx.fillStyle=g;ctx.fillRect(0,0,720,1280)};
  blob(560+drift,140,430,'rgba(215,140,255,.26)');
  blob(90-drift,1140,400,'rgba(57,216,255,.18)');
  blob(380,620,520,'rgba(64,110,255,.10)');
}
function brand(y,s,a){ctx.globalAlpha=a;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.font=`400 ${s}px Nunito, sans-serif`;ctx.fillStyle='#eaf4ff';const w1=ctx.measureText('os').width;
  ctx.fillText('os',70,y);ctx.font=`800 ${s}px Nunito, sans-serif`;ctx.fillStyle='#d78cff';ctx.fillText('marks',70+w1,y);ctx.globalAlpha=1}
function big(t,y,s,a){ctx.globalAlpha=a;ctx.textAlign='left';ctx.font=`900 ${s}px Nunito, sans-serif`;ctx.fillStyle='#eaf4ff';ctx.fillText(t,70,y);ctx.globalAlpha=1}
function fitBig(t,maxW,base){let s=base;ctx.font=`900 ${s}px Nunito, sans-serif`;while(ctx.measureText(t).width>maxW&&s>24){s-=2;ctx.font=`900 ${s}px Nunito, sans-serif`}return s}
const SC=2.4,DUR=12;
function frame(el,name,no,qc){
  const t=el/DUR;
  aurora(t*Math.PI*2);
  const scene=Math.min(4,Math.floor(el/SC));
  const local=(el-scene*SC)/SC;
  const inA=pop(Math.min(1,local/0.35));
  const outA=scene===4?1:1-Math.max(0,(local-0.82)/0.18)*0.9;
  ctx.globalAlpha=Math.min(inA,outA);
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  if(scene===0){brand(620,64,inA);big('开源 AI 工具',760,66,inA);big('讲成人话的榜单',856,66,inA);}
  if(scene===1){big('100 个工具',600,86,inA);big('只留真能用的',712,86,inA);
    ctx.font='700 30px Nunito, sans-serif';ctx.fillStyle='#9db4d0';ctx.globalAlpha=inA*.9;ctx.fillText('按热度排，按场景分，每周更新',70,800);ctx.globalAlpha=Math.min(inA,outA);}
  if(scene===2){big('实测 · 排雷',620,86,inA);
    ctx.font='700 30px Nunito, sans-serif';ctx.fillStyle='#9db4d0';ctx.globalAlpha=inA*.9;ctx.fillText('跑不通的也写出来，Marks 认证',70,740);ctx.globalAlpha=Math.min(inA,outA);}
  if(scene===3){brand(560,64,inA);big('领取你的分站',680,72,inA);big('分润公开结算',776,72,inA);}
  if(scene===4){
    brand(520,64,inA);
    const s=fitBig(name,580,96);
    ctx.font=`900 ${s}px Nunito, sans-serif`;ctx.fillStyle='#d78cff';ctx.fillText(name,70,700);
    const w1=ctx.measureText(name).width;
    ctx.font='800 44px Nunito, sans-serif';ctx.fillStyle='#eaf4ff';ctx.fillText('.osmarks.com',70+w1,700);
    big('扫码直达 · 开源 AI 工具',790,34,inA);
    if(qc){const qs=230,qx=(720-qs)/2,qy=850;rr(qx-18,qy-18,qs+36,qs+36,26);
      ctx.fillStyle=`rgba(18,32,58,${.55*inA})`;ctx.fill();ctx.strokeStyle=`rgba(137,205,255,${.3*inA})`;ctx.stroke();
      ctx.globalAlpha=inA;ctx.drawImage(qc,qx,qy,qs,qs);ctx.globalAlpha=1;}
  }
  ctx.globalAlpha=Math.min(1,outA)*.85;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 20px Nunito, sans-serif';ctx.fillStyle='#5b7191';ctx.fillText('osmarks.com · 开源马克斯',360,1236);
  ctx.textAlign='left';ctx.globalAlpha=1;
}
$('#go').onclick=async()=>{
  const name=($('#name').value||'yourname').trim().replace(/[^a-zA-Z0-9_-]/g,'')||'yourname';
  const no=($('#no').value||'').trim();
  const st=$('#status'),btn=$('#go');
  try{await document.fonts.load(`900 90px Nunito`);await document.fonts.load(`700 30px Nunito`)}catch(e){}
  const qc=qrCanvas('https://'+name+'.osmarks.com',230);
  const stream=cv.captureStream(30);
  const mime=fmt('video/webm;codecs=vp9');
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5_000_000});
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(res=>rec.onstop=res);
  btn.disabled=true;st.textContent='正在渲染 0%';
  rec.start(250);
  const t0=performance.now();
  await new Promise(res=>{
    function tick(now){
      const el=(now-t0)/1000;
      if(el>=DUR){res();return}
      frame(el,name,no,qc);
      st.textContent='正在渲染 '+Math.min(99,Math.round(el/DUR*100))+'%';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
  rec.stop();await done;
  const blob=new Blob(chunks,{type:mime});
  const u=URL.createObjectURL(blob);
  const pv=$('#pv'),dl=$('#dl');
  pv.src=u;pv.style.display='block';
  dl.href=u;dl.download=`osmarks-${name}-promo.webm`;dl.style.display='inline-block';
  st.textContent='渲染完成，12 秒 · 可以直接下载发布';
  btn.disabled=false;
};
</script>
