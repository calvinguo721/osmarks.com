<!doctype html><html lang="zh-CN" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>联盟分润透明账本｜开源马克斯 osmarks.com</title>
<meta name="description" content="开源马克斯二级域名联盟分销透明账本。打赏分润 70%、基建分销 20%~30%，每笔账目全量公示，绝不造假。">
<link rel="canonical" href="https://osmarks.com/ally/ledger.html">
<meta name="theme-color" content="#040b18">
<link rel="stylesheet" href="../assets/osmarks.css">
<style>
.ledger-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; font-size: 0.95rem; }
.ledger-table th, .ledger-table td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color, #1e293b); }
.ledger-table th { background: rgba(255,255,255,0.03); color: var(--text-muted, #94a3b8); }
.badge-pending { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; background: rgba(234, 179, 8, 0.15); color: #eab308; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
.stat-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color, #1e293b); border-radius: 8px; padding: 1.25rem; }
.stat-card .num { font-size: 1.8rem; font-weight: bold; color: var(--text-color, #f8fafc); margin-top: 0.5rem; }
</style>
</head><body><header class="nav"><div class="wrap nav-inner">
<a class="brand" href="../index.html">os<b>marks</b></a>
<nav class="nav-links">
<a href="../rankings.html">榜单</a>
<a href="../infra.html">出海基建</a>
<a href="../ally.html">分站联盟</a>
<a href="ledger.html" class="active">透明账本</a>
<a href="../about.html">关于</a>
</nav></div></header>
<main class="wrap">
<section class="hero">
  <span class="kicker">OSMARKS ALLIANCE · TRANSPARENCY</span>
  <h1>联盟分润透明账本</h1>
  <p class="lead">商业立信，从每一分钱摊开看开始。三铁律下的联盟分销承诺：打赏收益 70% 直结分站，基建推荐 20%~30% 分润。先定结构，先能看，再能算。</p>
</section>

<div class="stat-grid">
  <div class="stat-card">
    <div class="label">打赏分润比例</div>
    <div class="num">70%</div>
  </div>
  <div class="stat-card">
    <div class="label">基建分销返点</div>
    <div class="num">20% ~ 30%</div>
  </div>
  <div class="stat-card">
    <div class="label">已登记分站</div>
    <div class="num" id="statAllies">12 个</div>
  </div>
  <div class="stat-card">
    <div class="label">累计公示结算</div>
    <div class="num" id="statTotal">¥ 0.00</div>
  </div>
</div>

<section style="margin-top: 2rem;">
  <h2>公示明细流水</h2>
  <table class="ledger-table">
    <thead>
      <tr>
        <th>流水单号</th>
        <th>日期</th>
        <th>分站标识 (Tenant)</th>
        <th>收益来源</th>
        <th>总金额</th>
        <th>分站应得</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody id="ledgerRows">
      <!-- Generated by ledger.js -->
    </tbody>
  </table>
</section>
</main>

<script src="../data/ledger.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const data = window.OSMARKS_LEDGER;
  if (!data) return;
  const tbody = document.getElementById('ledgerRows');
  if (tbody && data.entries) {
    tbody.innerHTML = data.entries.map(e => `
      <tr>
        <td><code>${e.id}</code></td>
        <td>${e.date}</td>
        <td><b>${e.tenant}.osmarks.com</b></td>
        <td>${e.source}</td>
        <td>¥ ${e.gross_cny.toFixed(2)}</td>
        <td style="color: #10b981; font-weight: bold;">¥ ${e.ally_share_cny.toFixed(2)}</td>
        <td><span class="badge-pending">${e.status}</span></td>
      </tr>
    `).join('');
  }
});
</script>
</body></html>
