<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Osmarks · 账号工作台</title>
  <style>
    :root{--aqua:#39d8ff;--violet:#d78cff;--action:#d78cff;--ink:#edf7ff;--muted:#a9bfd6;--bg:#040b18;--panel:rgba(5,15,31,.78);--line:rgba(137,205,255,.22)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito","M PLUS Rounded 1c","Arial Rounded MT Bold",system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    body{background:linear-gradient(110deg,rgba(4,11,24,.96),rgba(4,14,31,.86) 52%,rgba(12,8,28,.88)),url("assets/hero-user.png") center/cover fixed no-repeat}
    .shell{width:min(1040px,calc(100% - 40px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-size:23px;font-weight:800;letter-spacing:-.07em;color:var(--ink);text-decoration:none}.brand b{color:var(--violet)}.top-actions{display:flex;align-items:center;gap:20px}.back{color:var(--action);text-decoration:none;font-size:13px}.lang{font:inherit;color:var(--action);background:none;border:0;border-radius:0;padding:8px 0;cursor:pointer;font-size:13px}.lang:hover{color:var(--ink)}
    .layout{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.25fr);gap:18px;margin-top:34px}.card{padding:26px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);border-radius:20px}.tag{font-size:11px;letter-spacing:.14em;color:var(--aqua);font-weight:700}.card h1{font-size:clamp(30px,5vw,54px);line-height:1.08;letter-spacing:-.06em;margin:14px 0}.card h2{font-size:20px;margin:0 0 8px}.card p{color:var(--muted);line-height:1.6}.oauth-row{display:flex;align-items:center;gap:10px;margin:18px 0 8px}.oauth-row button{flex:1;font:inherit;color:var(--ink);background:linear-gradient(100deg,rgba(215,140,255,.22),rgba(57,216,255,.12));border:1px solid var(--action);border-radius:12px;padding:11px;cursor:pointer}.oauth-row span{color:var(--muted);font-size:12px}.oauth-status{color:var(--action)!important;font-size:12px;white-space:nowrap}.provider-note{margin:8px 0 12px!important;font-size:12px!important;color:var(--muted)!important}.tabs{display:flex;gap:8px;margin:12px 0 14px}.tabs button,.actions button,.actions a{font:inherit;color:var(--ink);background:rgba(9,28,51,.76);border:1px solid var(--line);border-radius:999px;padding:9px 13px;text-decoration:none;cursor:pointer}.tabs button.active,.tabs button:hover,.actions button:hover,.actions a:hover{border-color:var(--action);color:var(--action)}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(0,8,20,.48);color:var(--ink);font:inherit}.primary{width:100%;margin-top:12px;padding:12px;border:1px solid var(--action);border-radius:12px;background:rgba(215,140,255,.14);color:var(--ink);font:inherit;cursor:pointer}.primary:hover{background:rgba(215,140,255,.23)}.hint,.note{font-size:12px;color:var(--muted)}.session{display:none}.session.active{display:block}.profile{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(0,8,20,.3)}.profile strong{display:block}.badge{color:var(--violet);font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.preview{border:1px solid var(--line);background:#030914;overflow:hidden;border-radius:14px}.preview canvas{display:block;width:100%;height:auto}.status{min-height:20px;margin:10px 0;color:var(--action);font-size:13px}@media(max-width:760px){.shell{width:min(100% - 24px,1040px);padding-top:16px}.top{align-items:flex-start}.layout{grid-template-columns:1fr}.card{padding:20px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><a class="brand" href="index.html" aria-label="osmarks home">os<b>marks</b></a><div class="top-actions"><a class="back" id="back-home" href="index.html">返回首页 ↗</a><button class="lang" id="lang" type="button" aria-label="切换语言">EN / 中文</button></div></header>
    <div class="layout">
      <section class="card" id="auth-card"><span class="tag" id="auth-tag">ACCOUNT · 账号</span><h1 id="auth-title">加入 Osmarks</h1><p id="auth-intro">保存你的榜单偏好、真实使用记录和分享素材。注册后可获得早期贡献编号，并在账号中查看自己的公开贡献。</p><div class="oauth-row" id="oauth-row" aria-label="第三方登录"><button id="chatgpt-login" type="button" aria-describedby="chatgpt-login-note">使用 ChatGPT 登录</button><span class="oauth-status" id="oauth-status">即将开放</span><span id="oauth-or">或</span></div><p class="provider-note" id="chatgpt-login-note">ChatGPT 登录入口即将开放；现在可以使用邮箱登录或注册。</p><div class="tabs"><button class="active" data-mode="login" id="login-tab" type="button">邮箱登录</button><button data-mode="register" id="register-tab" type="button">邮箱注册</button></div><form id="auth-form"><div class="field"><label for="email" id="email-label">邮箱</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password" id="password-label">密码</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="至少 6 位"></div><button class="primary" type="submit" id="auth-submit">登录账号</button></form><p class="status" id="auth-status" aria-live="polite"></p><p class="hint" id="auth-hint">邮箱账号保存在当前浏览器；换设备后需要重新注册。</p></section>
      <section class="card session" id="workspace"><span class="tag" id="workspace-tag">ACCOUNT · 我的空间</span><h2 id="welcome-title">欢迎回来</h2><div class="profile"><div><strong id="profile-email"></strong><span class="badge" id="profile-badge"></span></div><button class="tabs button" id="logout" type="button">退出</button></div><p id="workspace-intro">为项目、真实使用案例或创作者信息生成分享素材。来源、署名和 Osmarks 链接会保留在素材中。</p><div class="actions"><button class="active" data-kind="project" id="kind-project" type="button">项目聚光灯</button><button data-kind="success" id="kind-success" type="button">用户实测</button><button data-kind="creator" id="kind-creator" type="button">创作者感谢</button><button id="make" type="button">生成分享图</button><a id="download" download="osmarks-share.png" href="#">下载 PNG</a></div><p class="note" id="workspace-note">发布前请确认署名、数据和授权；生成后由你决定在哪里分享。</p><div class="preview"><canvas id="canvas" width="1200" height="630" aria-label="分享素材预览"></canvas></div></section>
    </div>
  </main>
  <script>
    const storeKey="osmarks.account.v1", read=()=>{try{return JSON.parse(localStorage.getItem(storeKey)||"null")}catch{return null}}, write=value=>localStorage.setItem(storeKey,JSON.stringify(value)), hashPassword=async value=>Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value)))).map(byte=>byte.toString(16).padStart(2,"0")).join("");
    let english=localStorage.getItem("osmarks.lang")==="en", mode="login", kind="project", currentAccount=null, statusCode="";
    const copy=()=>english?{
      pageTitle:"Osmarks · account workspace",back:"Back home ↗",authTag:"ACCOUNT · YOUR ACCOUNT",authTitle:"Join Osmarks",authIntro:"Save your ranking preferences, real usage notes and share assets. Registration gives you an early contribution number and a place to view your public contributions.",oauthAria:"Third-party sign-in",chatgpt:"Continue with ChatGPT",oauthStatus:"Opening soon",or:"or",providerNote:"ChatGPT sign-in is opening soon; use email sign-in or registration for now.",loginTab:"Email sign-in",registerTab:"Email registration",email:"Email",password:"Password",passwordPlaceholder:"At least 6 characters",login:"Sign in",register:"Create account",authHint:"Your email account is saved in this browser; register again when you move to another device.",workspaceTag:"ACCOUNT · MY SPACE",welcome:"Welcome back",logout:"Sign out",workspaceIntro:"Create share assets for projects, real usage cases or creator information. Sources, attribution and the Osmarks link stay on every asset.",project:"Project spotlight",success:"User field note",creator:"Creator thanks",make:"Generate share image",download:"Download PNG",workspaceNote:"Confirm attribution, data and permission before publishing; you decide where to share the finished asset.",canvasAria:"Share asset preview",earlyBadge:"Early contribution number",canvasProof:"Curated by Osmarks · original source link preserved",canvasSuccess:"From the Osmarks community · open to review and discussion",canvasCreator:"Discover more open-source AI projects: osmarks",canvasFooter:"Source and attribution subject to review",canvasLine:"Discover, verify, share open-source AI",canvasLink:"Original source and full details · osmarks.marks370944.chatgpt.site",statusChatGPT:"ChatGPT sign-in is opening soon; use email sign-in or registration for now.",existing:"This email already exists. Please sign in instead.",mismatch:"Email or password does not match.",shortPassword:"Use at least 6 characters for the password."
    }:{
      pageTitle:"Osmarks · 账号工作台",back:"返回首页 ↗",authTag:"ACCOUNT · 账号",authTitle:"加入 Osmarks",authIntro:"保存你的榜单偏好、真实使用记录和分享素材。注册后可获得早期贡献编号，并在账号中查看自己的公开贡献。",oauthAria:"第三方登录",chatgpt:"使用 ChatGPT 登录",oauthStatus:"即将开放",or:"或",providerNote:"ChatGPT 登录入口即将开放；现在可以使用邮箱登录或注册。",loginTab:"邮箱登录",registerTab:"邮箱注册",email:"邮箱",password:"密码",passwordPlaceholder:"至少 6 位",login:"登录账号",register:"创建账号",authHint:"邮箱账号保存在当前浏览器；换设备后需要重新注册。",workspaceTag:"ACCOUNT · 我的空间",welcome:"欢迎回来",logout:"退出",workspaceIntro:"为项目、真实使用案例或创作者信息生成分享素材。来源、署名和 Osmarks 链接会保留在素材中。",project:"项目聚光灯",success:"用户实测",creator:"创作者感谢",make:"生成分享图",download:"下载 PNG",workspaceNote:"发布前请确认署名、数据和授权；生成后由你决定在哪里分享。",canvasAria:"分享素材预览",earlyBadge:"早期贡献编号",canvasProof:"由 Osmarks 整理 · 原始链接可追溯",canvasSuccess:"来自 Osmarks 社区 · 欢迎复核与讨论",canvasCreator:"发现更多全球开源 AI 项目：osmarks",canvasFooter:"信息来源和署名以发布前审核为准",canvasLine:"发现、验证、传播开源 AI",canvasLink:"原始链接与完整信息 · osmarks.marks370944.chatgpt.site",statusChatGPT:"ChatGPT 登录入口即将开放；当前请使用邮箱登录或邮箱注册。",existing:"该邮箱已存在，请直接登录。",mismatch:"邮箱或密码不匹配。",shortPassword:"密码至少需要 6 位。"
    };
    const data={project:{zh:["标记一个值得关注的开源 AI 项目","项目聚光灯","由 Osmarks 整理 · 原始链接可追溯"],en:["Mark an open-source AI project worth watching","Project spotlight","Curated by Osmarks · original source link preserved"]},success:{zh:["我用这个工具完成了真实工作","真实使用案例","来自 Osmarks 社区 · 欢迎复核与讨论"],en:["I completed real work with this tool","Real usage case","From the Osmarks community · open to review and discussion"]},creator:{zh:["感谢每一位认真做开源的人","创作者感谢","发现更多全球开源 AI 项目：osmarks"],en:["Thank everyone who builds in the open","Creator thanks","Discover more open-source AI projects: osmarks"]}};
    const byId=id=>document.getElementById(id), modeButtons=document.querySelectorAll("[data-mode]"), form=byId("auth-form"), submit=byId("auth-submit"), status=byId("auth-status"), c=byId("canvas"), d=byId("download"), buttons=document.querySelectorAll("[data-kind]");
    function setStatus(code){statusCode=code;status.textContent=code?copy()[code]:""}
    function setLanguage(){const t=copy();document.documentElement.lang=english?"en":"zh-CN";document.title=t.pageTitle;byId("back-home").textContent=t.back;byId("lang").textContent=english?"Chinese / EN":"EN / 中文";byId("lang").setAttribute("aria-label",english?"Switch language":"切换语言");byId("auth-tag").textContent=t.authTag;byId("auth-title").textContent=t.authTitle;byId("auth-intro").textContent=t.authIntro;byId("oauth-row").setAttribute("aria-label",t.oauthAria);byId("chatgpt-login").textContent=t.chatgpt;byId("oauth-status").textContent=t.oauthStatus;byId("oauth-or").textContent=t.or;byId("chatgpt-login-note").textContent=t.providerNote;byId("login-tab").textContent=t.loginTab;byId("register-tab").textContent=t.registerTab;byId("email-label").textContent=t.email;byId("password-label").textContent=t.password;byId("email").placeholder="you@example.com";byId("password").placeholder=t.passwordPlaceholder;submit.textContent=mode==="register"?t.register:t.login;byId("auth-hint").textContent=t.authHint;byId("workspace-tag").textContent=t.workspaceTag;byId("welcome-title").textContent=t.welcome;byId("logout").textContent=t.logout;byId("workspace-intro").textContent=t.workspaceIntro;byId("kind-project").textContent=t.project;byId("kind-success").textContent=t.success;byId("kind-creator").textContent=t.creator;byId("make").textContent=t.make;byId("download").textContent=t.download;byId("workspace-note").textContent=t.workspaceNote;c.setAttribute("aria-label",t.canvasAria);if(currentAccount)byId("profile-badge").textContent=`${t.earlyBadge} · #${currentAccount.earlyId}`;setStatus(statusCode);draw()}
    byId("lang").addEventListener("click",()=>{english=!english;localStorage.setItem("osmarks.lang",english?"en":"zh");setLanguage()});
    byId("chatgpt-login").addEventListener("click",()=>setStatus("statusChatGPT"));
    modeButtons.forEach(button=>button.addEventListener("click",()=>{mode=button.dataset.mode;modeButtons.forEach(item=>item.classList.toggle("active",item===button));setStatus("");form.reset();setLanguage()}));
    function showSession(account){currentAccount=account;byId("auth-card").style.display="none";const workspace=byId("workspace");workspace.classList.add("active");byId("profile-email").textContent=account.email;byId("profile-badge").textContent=`${copy().earlyBadge} · #${account.earlyId}`}
    form.addEventListener("submit",async event=>{event.preventDefault();const email=byId("email").value.trim().toLowerCase(),password=byId("password").value;if(password.length<6){setStatus("shortPassword");return}const passwordHash=await hashPassword(password),existing=read();if(mode==="register"){if(existing?.email===email){setStatus("existing");return}const account={email,passwordHash,earlyId:Date.now().toString().slice(-6),createdAt:new Date().toISOString()};write(account);setStatus("");showSession(account);return}const oldPasswordMatch=existing?.password===password;if(!existing||existing.email!==email||(!oldPasswordMatch&&existing.passwordHash!==passwordHash)){setStatus("mismatch");return}if(oldPasswordMatch){delete existing.password;existing.passwordHash=passwordHash;write(existing)}setStatus("");showSession(existing)});
    byId("logout").addEventListener("click",()=>{currentAccount=null;byId("workspace").classList.remove("active");byId("auth-card").style.display="block"});
    function draw(){const t=copy(),item=data[kind][english?"en":"zh"],x=c.getContext("2d"),w=c.width,h=c.height,g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,"#061326");g.addColorStop(.58,"#0b315b");g.addColorStop(1,"#5b2c78");x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle="rgba(0,8,20,.32)";x.fillRect(0,0,w*.58,h);x.fillStyle="#39d8ff";x.font="700 24px Arial";x.fillText("OSMARKS · "+item[1].toUpperCase(),64,76);x.fillStyle="#eef7ff";x.font="800 52px Arial";x.fillText(item[0],64,190);x.fillStyle="#bed8ef";x.font="400 25px Arial";x.fillText(item[2],64,250);x.fillStyle="#d78cff";x.fillRect(64,312,170,5);x.fillStyle="#eef7ff";x.font="700 22px Arial";x.fillText(t.canvasLine,64,390);x.fillStyle="#9fb9d2";x.font="400 20px Arial";x.fillText(t.canvasLink,64,445);x.fillStyle="rgba(255,255,255,.72)";x.font="400 18px Arial";x.fillText(t.canvasFooter,64,560);d.href=c.toDataURL("image/png")}
    buttons.forEach(b=>b.addEventListener("click",()=>{buttons.forEach(q=>q.classList.remove("active"));b.classList.add("active");kind=b.dataset.kind;draw()}));byId("make").addEventListener("click",draw);const account=read();if(account)showSession(account);setLanguage();
  </script>
</body>
</html>
