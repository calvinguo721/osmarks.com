<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Osmarks 社区论坛</title>
  <style>
    :root{--aqua:#39d8ff;--violet:#d78cff;--action:#d78cff;--ink:#edf7ff;--muted:#a9bfd6;--bg:#040b18;--panel:rgba(5,15,31,.82);--line:rgba(137,205,255,.22)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito","M PLUS Rounded 1c","Arial Rounded MT Bold",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
    body{background:linear-gradient(105deg,rgba(4,11,24,.98),rgba(4,14,31,.9) 60%,rgba(24,8,38,.76)),url("assets/hero-user.png") center/cover fixed no-repeat}a{color:inherit;text-decoration:none}
    .shell{width:min(1080px,calc(100% - 40px));margin:auto;padding:26px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:800;letter-spacing:-.07em}.brand b{color:var(--violet)}.top-actions{display:flex;align-items:center;gap:20px}.top-actions>a{color:var(--action);font-size:13px}.lang{font:inherit;color:var(--action);background:none;border:0;border-radius:0;padding:8px 0;cursor:pointer;font-size:13px}.lang:hover{color:var(--ink)}
    .intro{margin:58px 0 26px;max-width:720px}.tag{color:var(--aqua);font-size:11px;letter-spacing:.16em}.intro h1{font-size:clamp(42px,7vw,78px);line-height:1;letter-spacing:-.08em;margin:12px 0}.intro p{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:16px}.card{border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(16px);padding:22px}.card h2{margin:0 0 6px;font-size:20px}.card>p{margin:0 0 18px;color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:11px 0}.field label{color:var(--muted);font-size:12px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(0,8,20,.5);color:var(--ink);padding:11px 12px;font:inherit}.field textarea{min-height:110px;resize:vertical}.primary{border:1px solid var(--action);border-radius:999px;background:rgba(215,140,255,.14);color:var(--ink);padding:10px 15px;font:inherit;cursor:pointer}.primary:hover{background:rgba(215,140,255,.22)}.status{min-height:18px;color:var(--action);font-size:12px;margin:10px 0}.threads{margin-top:18px;border-top:1px solid var(--line)}.thread{padding:16px 0;border-bottom:1px solid var(--line)}.thread strong{display:block}.thread small{color:var(--muted)}.thread p{margin:7px 0;color:#d7e3ef}.mention{color:var(--action)}.board{display:grid;gap:8px;margin-top:15px}.leader{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px;background:rgba(0,8,20,.28)}.leader span:first-child{color:var(--muted)}.leader b{color:var(--violet);font-size:13px}.note{font-size:12px!important;margin-top:16px!important}@media(max-width:760px){.shell{width:min(100% - 24px,1080px);padding-top:16px}.top{align-items:flex-start}.layout{grid-template-columns:1fr}.intro{margin-top:38px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><a class="brand" href="index.html" aria-label="osmarks home">os<b>marks</b></a><div class="top-actions"><a id="back-home" href="index.html">返回首页 ↗</a><button class="lang" id="lang" type="button" aria-label="切换语言">EN / 中文</button></div></header>
    <section class="intro"><span class="tag" id="community-tag">COMMUNITY · 社区</span><h1 id="intro-title">围绕真实工具说真话</h1><p id="intro-copy">提出需求、分享结果、@榜单项目。讨论必须带来可复核的信息，帮助创作者和使用者一起进步。</p></section>
    <div class="layout">
      <section class="card"><h2 id="post-title">发起讨论</h2><p id="post-copy">内容先保存在当前浏览器；登录后可以继续整理并分享给社区。</p><form id="post-form"><div class="field"><label for="author" id="author-label">你的名称</label><input id="author" required maxlength="40" placeholder="名称或组织"></div><div class="field"><label for="title" id="topic-label">主题</label><input id="title" required maxlength="90" placeholder="你想解决什么问题"></div><div class="field"><label for="body" id="body-label">内容</label><textarea id="body" required maxlength="1000" placeholder="写清需求、使用场景或真实结果；可输入 @项目名"></textarea></div><button class="primary" id="publish" type="submit">公开发布</button><p class="status" id="status" aria-live="polite"></p></form><div class="threads" id="threads"></div></section>
      <aside class="card" id="contributions"><h2 id="board-title">代币贡献榜</h2><p id="board-copy">越早首次登录，获得越早期的贡献编号；榜单先记录公开参与；奖励与支持规则准备好后会公布。</p><div class="board"><div class="leader"><span>01</span><strong id="leader-one">开源创作者</strong><b id="leader-one-badge">创作者</b></div><div class="leader"><span>02</span><strong id="leader-two">已验证用户</strong><b id="leader-two-badge">实证</b></div><div class="leader"><span>03</span><strong id="leader-three">社区支持者</strong><b id="leader-three-badge">支持</b></div></div><p class="note" id="board-note">奖励与支持入口会在规则准备好后开放。当前页面不接受付款。</p></aside>
    </div>
  </main>
  <script>
    const key="osmarks.forum.v1",seedZh={author:"Osmarks",title:"今天你用哪个开源 AI 工具完成了真实工作？",body:"欢迎分享任务、耗时、成本和结果。真实数据会帮助更多人做出可靠选择。",createdAt:new Date().toISOString()},seedEn={author:"Osmarks",title:"Which open-source AI tool helped you do real work today?",body:"Share the task, time, cost and result. Real data helps everyone make a reliable choice.",createdAt:seedZh.createdAt};
    let english=localStorage.getItem("osmarks.lang")==="en",statusCode="";
    const copy=()=>english?{title:"Osmarks community forum",back:"Back home ↗",tag:"COMMUNITY · FORUM",introTitle:"Speak plainly about real tools",introCopy:"Bring a need, share a result, or @ a project from the rankings. Every discussion should add information that creators and users can verify.",postTitle:"Start a discussion",postCopy:"Posts stay in this browser for now; sign in to keep your discussion organized and share it with the community.",author:"Your name",authorPlaceholder:"Name or organization",topic:"Topic",topicPlaceholder:"What are you trying to solve?",body:"Post",bodyPlaceholder:"Describe the need, context or real result; you can type @project-name",publish:"Publish publicly",boardTitle:"Token contribution board",boardCopy:"Earlier first sign-ins receive earlier contribution numbers. This board records public participation; reward and support rules will be announced when ready.",leaders:["Open-source builders","Verified users","Community supporters"],badges:["CREATOR","PROOF","SUPPORT"],boardNote:"Rewards and support options will open after the rules are ready. This page does not accept payments yet.",loginNeeded:"Please sign in or register in the account workspace first.",saved:"Saved in this browser.",switchAria:"Switch language",dateLocale:"en-US"}:{title:"Osmarks 社区论坛",back:"返回首页 ↗",tag:"COMMUNITY · 社区",introTitle:"围绕真实工具说真话",introCopy:"提出需求、分享结果、@榜单项目。讨论必须带来可复核的信息，帮助创作者和使用者一起进步。",postTitle:"发起讨论",postCopy:"内容先保存在当前浏览器；登录后可以继续整理并分享给社区。",author:"你的名称",authorPlaceholder:"名称或组织",topic:"主题",topicPlaceholder:"你想解决什么问题",body:"内容",bodyPlaceholder:"写清需求、使用场景或真实结果；可输入 @项目名",publish:"公开发布",boardTitle:"代币贡献榜",boardCopy:"越早首次登录，获得越早期的贡献编号；榜单先记录公开参与；奖励与支持规则准备好后会公布。",leaders:["开源创作者","已验证用户","社区支持者"],badges:["创作者","实证","支持"],boardNote:"奖励与支持入口会在规则准备好后开放。当前页面不接受付款。",loginNeeded:"请先在账号工作台注册或登录。",saved:"已保存到当前浏览器。",switchAria:"切换语言",dateLocale:"zh-CN"};
    const byId=id=>document.getElementById(id),escape=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    function seedForLanguage(){return english?seedEn:seedZh}
    const read=()=>{try{const parsed=JSON.parse(localStorage.getItem(key)||"null");return Array.isArray(parsed)&&parsed.length?parsed:[seedForLanguage()]}catch{return [seedForLanguage()]}},write=value=>localStorage.setItem(key,JSON.stringify(value));
    function setStatus(code){statusCode=code;byId("status").textContent=code?copy()[code]:""}
    function render(){const items=read();byId("threads").innerHTML=items.map(item=>{const isSeed=item.author==="Osmarks"&&(item.title===seedZh.title||item.title===seedEn.title);const localized=isSeed?seedForLanguage():item;return `<article class="thread"><strong>${escape(localized.title)}</strong><small>${escape(localized.author)} · ${new Date(localized.createdAt).toLocaleString(copy().dateLocale)}</small><p>${escape(localized.body).replace(/(^|\s)(@[\w\-\u4e00-\u9fff]+)/g,'$1<span class="mention">$2</span>')}</p></article>`}).join("")}
    function setLanguage(){const t=copy();document.documentElement.lang=english?"en":"zh-CN";document.title=t.title;byId("back-home").textContent=t.back;byId("lang").textContent=english?"Chinese / EN":"EN / 中文";byId("lang").setAttribute("aria-label",t.switchAria);byId("community-tag").textContent=t.tag;byId("intro-title").textContent=t.introTitle;byId("intro-copy").textContent=t.introCopy;byId("post-title").textContent=t.postTitle;byId("post-copy").textContent=t.postCopy;byId("author-label").textContent=t.author;byId("author").placeholder=t.authorPlaceholder;byId("topic-label").textContent=t.topic;byId("title").placeholder=t.topicPlaceholder;byId("body-label").textContent=t.body;byId("body").placeholder=t.bodyPlaceholder;byId("publish").textContent=t.publish;byId("board-title").textContent=t.boardTitle;byId("board-copy").textContent=t.boardCopy;["leader-one","leader-two","leader-three"].forEach((id,index)=>byId(id).textContent=t.leaders[index]);["leader-one-badge","leader-two-badge","leader-three-badge"].forEach((id,index)=>byId(id).textContent=t.badges[index]);byId("board-note").textContent=t.boardNote;setStatus(statusCode);render()}
    byId("lang").addEventListener("click",()=>{english=!english;localStorage.setItem("osmarks.lang",english?"en":"zh");setLanguage()});
    byId("post-form").addEventListener("submit",event=>{event.preventDefault();const account=localStorage.getItem("osmarks.account.v1");if(!account){setStatus("loginNeeded");return}const items=read();items.unshift({author:byId("author").value.trim(),title:byId("title").value.trim(),body:byId("body").value.trim(),createdAt:new Date().toISOString()});write(items.slice(0,50));event.target.reset();setStatus("saved");render()});
    setLanguage();
  </script>
</body>
</html>
